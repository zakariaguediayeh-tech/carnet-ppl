<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00509e">
<title>Carnet PPL</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --blue:#00509e; --blue-d:#003a73; --blue-l:#e8f1fb;
  --bg:#0f1115; --card:#181b22; --card2:#1f242e;
  --txt:#e8ecf3; --muted:#9aa4b2; --line:#2a3140;
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none}
body{padding-bottom:80px}
header{position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--blue),var(--blue-d));
  padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
  box-shadow:0 2px 12px rgba(0,0,0,.4)}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
.wrap{padding:14px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.pill{background:var(--blue-l);color:var(--blue-d);font-weight:700;
  font-size:11px;padding:4px 9px;border-radius:999px}
.btn{background:var(--blue);color:#fff;border:none;border-radius:12px;
  padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.97)}
.seg{display:flex;gap:6px;background:var(--card2);padding:5px;border-radius:14px}
.seg button{flex:1;background:none;border:none;color:var(--muted);
  font-weight:700;font-size:13px;padding:9px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.daytag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;color:#fff}
.PUSH{background:#2563eb}.PULL{background:#7c3aed}.LEGS{background:#059669}
.ex{padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.ex .name{font-weight:700;font-size:14px;line-height:1.3}
.ex .tag{font-size:11px;color:var(--muted)}
.sets{display:flex;gap:8px;margin-top:10px}
.setbox{flex:1;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:8px;text-align:center}
.setbox label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:700}
.setbox .in{display:flex;gap:4px;align-items:center;justify-content:center}
.setbox input{width:100%;background:#0d1014;border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:8px 4px;text-align:center;
  font-size:15px;font-weight:700;-moz-appearance:textfield}
.setbox input::-webkit-outer-spin-button,.setbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.setbox .x{font-size:11px;color:var(--muted)}
.hint{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:5px}
.hint.up{color:var(--green)} .hint.same{color:var(--amber)} .hint.none{color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.nav button{flex:1;background:none;border:none;color:var(--muted);
  font-size:11px;font-weight:700;padding:6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--blue)}
.nav svg{width:22px;height:22px}
.progwrap{height:9px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:8px}
.progbar{height:100%;background:linear-gradient(90deg,var(--blue),#3b82f6);border-radius:999px;transition:width .4s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card2);border-radius:14px;padding:14px;text-align:center}
.stat .v{font-size:26px;font-weight:800}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px}
.adviceblk{background:var(--blue-l);color:var(--blue-d);border-radius:12px;padding:12px;font-size:13px;line-height:1.5}
.adviceblk b{color:var(--blue-d)}
.weeksel{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.weeksel::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card2);border:1px solid var(--line);
  color:var(--muted);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.done{border-color:var(--green)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.bar{flex:1;background:var(--blue);border-radius:5px 5px 0 0;min-height:3px;position:relative;transition:height .4s}
.bar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
.barlbl{font-size:9px;color:var(--muted);text-align:center;margin-top:4px}
.done-badge{color:var(--green);font-size:12px;font-weight:800}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--green);color:#04210f;padding:11px 18px;border-radius:12px;
  font-weight:800;font-size:13px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.show{opacity:1}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="row between">
    <div>
      <h1>Carnet PPL — 6 Mois</h1>
      <div class="sub">Push / Pull / Legs · Vendredi-Samedi-Dimanche</div>
    </div>
    <div class="pill" id="hdrProg">0%</div>
  </div>
</header>

<div id="view"></div>

<div class="nav">
  <button data-tab="train" class="on" onclick="go('train')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M4 9h2v6H4zM18 9h2v6h-2zM6 12h12"/></svg>Séance</button>
  <button data-tab="cal" onclick="go('cal')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Planning</button>
  <button data-tab="stats" onclick="go('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-tab="info" onclick="go('info')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>Conseils</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
